baseURL: https://mybeer.recipes/
locale: en-us
title: mybeer.recipes
copyright: mybeer.recipes
publishDir: docs

enableRobotsTXT: true
disableKinds: [taxonomy, term]

outputs:
  home: [HTML]
  section: [HTML]
  page: [HTML]

sitemap:
  changeFreq: weekly
  priority: 0.5

markup:
  goldmark:
    parser:
      attribute:
        block: true
  tableOfContents:
    startLevel: 2
    endLevel: 2

imaging:
  resampleFilter: Lanczos
  jpeg:
    quality: 78
  webp:
    quality: 78

params:
  description: >-
    Brewing software for homebrewers and commercial breweries. Design recipes
    against their style, run each batch from mash to package, and track every
    lot of malt, hops and yeast across iOS, Android, macOS, Windows, Linux and
    the web.
  # The default social sharing image (1200×630 is cropped from this).
  image: images/brewing-kit.jpg
  # Where "Open web app", "Log in", "Get the app" and the platform cards point.
  # During the beta this is the sign-up page; set it to the web app's URL at launch.
  appURL: /beta/
  # Beta, blog and waitlist sign-ups go to listmonk. The lists must be public;
  # make them double opt-in so people confirm by email (the forms say a link
  # was sent).
  listmonk:
    url: https://listmonk.mybeer.recipes
    lists:
      # Lists → (list) → UUID. Both start as the default "Opt-in list"; create
      # "Beta – Homebrewers" and "Beta – Breweries" lists to split them.
      homebrewer: 72ad3e3f-1d05-4688-8244-91027c0a6949
      brewery: 9225b237-27e9-437c-b660-5a940336c14e
      # Product news list for the "Also send me product news" box. The box is
      # hidden while this and signupEndpoint are both empty.
      news: c935bec5-f00a-4a58-9207-d7cd50db461a
      # Lists for the blog's Subscribe form, the Developers page waitlist and
      # the Data API early access form. While one is empty, that form's button
      # opens an email to params.email instead.
      blog: 7cbc2e18-0f6c-43d7-a01e-0fe12f7d3ff8
      developers: 12ab44db-1f17-403d-8b05-cadde02805fe
      dataApi: bb83e6cf-c4c9-4f84-b75a-77bb77ac4c7a
    # Optional: URL of the workers/beta-signup Cloudflare Worker. When set, sign-ups
    # go through it so the brewery name and devices are stored on the subscriber.
    signupEndpoint: ""
  email: support@mybeer.recipes
  analytics:
    # Google Analytics 4. Only loaded after the visitor accepts analytics cookies.
    measurementId: G-TFQN26BKLY
  social:
    - https://bsky.app/profile/mybeer-recipes.bsky.social
    - https://github.com/mybeer-recipes
    - https://gitter.im/mybeer-recipes/community

menus:
  main:
    - name: Features
      url: /#features
      weight: 10
    - name: Pricing
      pageRef: /pricing
      weight: 20
    - name: Support
      pageRef: /support
      weight: 30
    - name: Blog
      pageRef: /blog
      weight: 40
      params:
        soon: true
    - name: Developers
      pageRef: /developers
      weight: 50
      params:
        soon: true

  footerProduct:
    - name: Features
      url: /#features
      weight: 10
    - name: Pricing
      pageRef: /pricing
      weight: 20
    - name: Download
      url: /#download
      weight: 30

  footerResources:
    - name: Support
      pageRef: /support
      weight: 10
    - name: Blog
      pageRef: /blog
      weight: 20
      params:
        soon: true
    - name: API docs
      pageRef: /developers
      weight: 30
      params:
        soon: true
    - name: Data API
      pageRef: /data-api
      weight: 40
      params:
        soon: true

  footerLegal:
    - name: Privacy policy
      pageRef: /legal/privacy
      weight: 10
    - name: Terms of service
      pageRef: /legal/terms
      weight: 20
    - name: Cookies
      url: /legal/privacy/#cookies
      weight: 30
    - name: Imprint
      url: /legal/#imprint
      weight: 40
    - name: All legal documents
      pageRef: /legal
      weight: 50
