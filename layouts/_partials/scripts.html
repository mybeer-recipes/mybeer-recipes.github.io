{{- with resources.Get "js/site.js" }}
  {{- $js := . | js.Build (dict "minify" hugo.IsProduction "target" "es2019") }}
  {{- if hugo.IsProduction }}{{ $js = $js | fingerprint }}{{ end }}
<script src="{{ $js.RelPermalink }}" defer{{ if hugo.IsProduction }} integrity="{{ $js.Data.Integrity }}" crossorigin="anonymous"{{ end }}{{ with site.Params.analytics.measurementId }} data-ga-id="{{ . }}"{{ end }}></script>
{{- end }}
