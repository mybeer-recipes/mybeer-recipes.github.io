{{ define "main" }}
<article class="mx-auto flex max-w-[760px] flex-col gap-8 px-6 pt-18 pb-28">
  <header class="flex flex-col gap-3.5">
    <h1 class="heading-1">{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
